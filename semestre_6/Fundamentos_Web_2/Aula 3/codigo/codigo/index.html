<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revisao de JavaScript</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Planeje sua Viagem</h1>
    </header>


    <main>

        <section>
            <h2>Escolha seu destino</h2>

            <p id="mensagemDestino">
                Nenhum destino selecionado.
            </p>

            <button id="btnBonito">
                Escolher Bonito
            </button>

            <button id="btnRio">
                Escolher Rio de Janeiro
            </button>
        </section>


        <section>
            <h2>Quantidade de viajantes</h2>

            <p>
                Viajantes:
                <span id="quantidade">1</span>
            </p>

            <button id="diminuir">
                -
            </button>

            <button id="aumentar">
                +
            </button>
        </section>


        <section>
            <h2>Cadastro</h2>

            <form id="formCadastro">

                <label for="nome">
                    Nome:
                </label>

                <input
                    type="text"
                    id="nome">

                <label for="idade">
                    Idade:
                </label>

                <input
                    type="number"
                    id="idade">

                <label for="email">
                    E-mail:
                </label>

                <input
                    type="email"
                    id="email">

                <button type="submit">
                    Cadastrar
                </button>

            </form>

            <p id="mensagemCadastro"></p>
        </section>


        <section>
            <h2>Preferências</h2>

            <button id="mostrarPreferencias">
                Mostrar preferências
            </button>

            <div id="preferencias" class="oculto">

                <p>Tipo de viagem:</p>

                <select id="tipoViagem">

                    <option value="">
                        Selecione
                    </option>

                    <option value="aventura">
                        Aventura
                    </option>

                    <option value="praia">
                        Praia
                    </option>

                    <option value="cultura">
                        Cultura
                    </option>

                </select>

                <button id="verSugestao">
                    Ver sugestão
                </button>

                <p id="sugestao"></p>

            </div>

        </section>


        <section>
            <h2>Lista de atividades</h2>

            <input
                type="text"
                id="novaAtividade"
                placeholder="Digite uma atividade">

            <button id="adicionarAtividade">
                Adicionar
            </button>

            <ul id="listaAtividades">

                <li>Pesquisar hospedagem</li>

            </ul>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
