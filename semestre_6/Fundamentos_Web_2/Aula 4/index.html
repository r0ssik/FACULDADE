<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Explorar Capitais de Países</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
</head>

<body>

    <nav class="navbar bg-dark border-bottom border-body" data-bs-theme="dark">

        <div class="container-fluid">

            <a class="navbar-brand" href="#">

                <img src="mundoo.png"
                    alt="Logo"
                    width="30"
                    height="24"
                    class="d-inline-block align-text-top">

                Explorar de Capitais de Países

            </a>

        </div>

    </nav>


    <main class="container mt-5">

        <h1 class="mb-3">
            Explore Países:
        </h1>


        <p class="mb-4">
            Digite um país para descobrir sua capital.
        </p>


        <form id="formPais">

            <div class="mb-4">

                <label for="pais" class="form-label">
                    Digite o país
                </label>

                <input
                    type="text"
                    id="pais"
                    class="form-control"
                    placeholder="Digite o país"
                    required>

            </div>


            <button
                id="botao_enviar"
                type="submit"
                class="btn btn-info">

                Submit

            </button>

        </form>


        <hr class="my-5">


        <section>

            <h3 class="fs-3 fst-italic mb-3">
                Resultado
            </h3>

            <p>
                Capital:
                <strong id="capital">-</strong>
            </p>

        </section>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYjWJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
    </script>

    <script src="script.js"></script>

</body>
